name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    # Weekly rebuild (Mondays 06:00 UTC) so the "Our footprint" page picks up
    # new rows of the dev repo's log_summary.csv between posts.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # Fetch the latest usage log from the dev repo and regenerate the Bokeh
      # page. Never fails the build: on any error the committed snapshot is used.
      - run: python scripts/build_footprint.py
      # -W turns warnings into errors so bad rst never goes live.
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
